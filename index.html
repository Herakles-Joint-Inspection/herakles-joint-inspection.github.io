<style>
/* Layout: one-phone site tool. Sticky top bar, plan as room picker, big tap targets, a bottom action bar for the next step. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#17202a; --muted:#5b6977; --line:#d4dbe2;
  --accent:#1f5fa8; --accent-ink:#ffffff; --accent-soft:#e2ecf8;
  --ok:#1b7743; --ok-soft:#dff1e6; --nok:#b42318; --nok-soft:#fbe4e1; --warn:#a86200; --warn-soft:#fcefd6; --na:#66727f; --na-soft:#eaedf1;
  --wall:#17202a; --room:#ffffff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#19212a; --ink:#e6ecf2; --muted:#98a6b4; --line:#2d3945;
  --accent:#6aa6ec; --accent-ink:#0c1520; --accent-soft:#1c2e44;
  --ok:#5bc489; --ok-soft:#163225; --nok:#ff8a7d; --nok-soft:#3a1c1a; --warn:#efb448; --warn-soft:#382a11; --na:#98a6b4; --na-soft:#242d37;
  --wall:#e6ecf2; --room:#19212a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --ink:#e6ecf2; --muted:#98a6b4; --line:#2d3945;
  --accent:#6aa6ec; --accent-ink:#0c1520; --accent-soft:#1c2e44;
  --ok:#5bc489; --ok-soft:#163225; --nok:#ff8a7d; --nok-soft:#3a1c1a; --warn:#efb448; --warn-soft:#382a11; --na:#98a6b4; --na-soft:#242d37;
  --wall:#e6ecf2; --room:#19212a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
header.top .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.back{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:9px;min-width:42px;height:42px;font-size:22px;cursor:pointer}
.ttl{flex:1;min-width:0}
.ttl .app{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;opacity:.85;display:block}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
h1{font-size:22px;margin:4px 0 6px;text-wrap:balance} h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:inherit;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.k{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.big{font-size:19px;font-weight:700}
.bar{height:7px;border-radius:4px;background:var(--na-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--na-soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.nok{background:var(--nok-soft);color:var(--nok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{color:var(--nok);border-color:var(--nok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
button:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,polygon:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--surface);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{min-height:52px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.choice button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.plan svg{display:block;width:100%;height:auto}
.rm{fill:var(--room);stroke:var(--wall);stroke-width:5;cursor:pointer}
.rm.s-prog{fill:var(--accent-soft)} .rm.s-done{fill:var(--ok-soft)} .rm.s-nok{fill:var(--nok-soft)} .rm.sel{fill:var(--accent-soft)} .rm.dim{opacity:.35}
.plan text{fill:var(--ink);font-family:var(--sans);font-size:34px;font-weight:600;pointer-events:none}
.plan .l2{font-size:24px;font-weight:500;fill:var(--muted)}
.plan .wb circle{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.plan .wb text{fill:var(--accent);font-family:var(--mono);font-size:20px;font-weight:600}
.plan .win{fill:var(--surface);stroke:var(--wall);stroke-width:2}
.rrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;width:100%}
.rrow .n{flex:1;min-width:0;font-weight:600}
.line{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.line.todo{border-left:4px solid var(--warn)}
.lh{display:flex;gap:10px;align-items:flex-start}
.lh .no{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:22px;padding-top:2px}
.lh b{display:block}
.lh small{color:var(--muted);font-size:13.5px}
.seg{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px}
.seg button{min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.seg button[data-v="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.seg button[data-v="nok"][aria-pressed="true"]{background:var(--nok);border-color:var(--nok);color:var(--surface)}
.seg button[data-v="na"][aria-pressed="true"]{background:var(--na);border-color:var(--na);color:var(--surface)}
.det{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.det .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--nok-soft);border-color:var(--nok);color:var(--nok);font-weight:600}
.chip.w{font-family:var(--mono)}
.chip.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{position:relative}
.ph img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block;background:var(--na-soft)}
.ph button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:14px;cursor:pointer}
.addph{display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px;border:1.5px dashed var(--line);border-radius:9px;color:var(--muted);font-size:12.5px;text-align:center;cursor:pointer;position:relative}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center}
.dock .info{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
.dock .info b{color:var(--ink);display:block;font-size:15px}
.pad{background:#fff;border:1.5px solid var(--line);border-radius:10px;touch-action:none;width:100%;height:200px;display:block}
.sigshow{background:#fff;border:1px solid var(--line);border-radius:8px;max-width:280px;width:100%}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.step{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.62);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay img{max-width:100%;max-height:85vh;border-radius:8px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<header class="top"><div class="in">
  <button class="back" id="backBtn" aria-label="Back" hidden>‹</button>
  <div class="ttl"><span class="app">HERAKLES JOINT INSPECTION APP</span><b id="hTitle">HUS B</b></div>
</div></header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>

<script>
(function(){
"use strict";
/* ===== project data ===== */
const APTS=[
 {id:"1113-1114",plan:11,lgh:"1110",typ:"14A",bq:"1113",bp:"1114"},
 {id:"1115-1116",plan:11,lgh:"1109",typ:"14A",bq:"1115",bp:"1116"},
 {id:"1117-1118",plan:11,lgh:"1108",typ:"14A",bq:"1117",bp:"1118"},
 {id:"1213-1214",plan:12,lgh:"1214",typ:"14B",bq:"1213",bp:"1214"},
 {id:"1215-1216",plan:12,lgh:"1213",typ:"14B",bq:"1215",bp:"1216"},
 {id:"1217-1218",plan:12,lgh:"1212",typ:"14B",bq:"1217",bp:"1218"}];
const DOOR="closing · leaf · frame · frame cover · frame cover 45° joint",SKIRT="gap wall/skirting · gap floor/skirting · paint spots",
 FLOOR="movement · scratch / spacing / water (SC, SP, W) · floor cut too short",WALLS="W1 · W2 · W3 · W4",CEIL="ceiling · ceiling accessories complete",
 RAD="installed · thermostat moving",WIN="opening / closing · handle · glass (scratch / crack) · frame & gasket · window sill",
 BAL="opening / closing · handle · glass (scratch / crack) · frame & gasket · threshold";
const ROOMS=[
 {k:"hall",name:"Entrance / Hall",items:[["Entrance door","closing · gasket · wooden threshold list · silicone · door frame"],["Wood floor","wood floor OK at entrance door"],["Skirting",SKIRT],["Clothes hanger","fixed · OK"],["Walls",WALLS],["Bathroom door (hall side)",DOOR],["FRD door",DOOR]]},
 {k:"frd",name:"FRD (storage)",items:[["Skirting",SKIRT],["Floor",FLOOR],["Painting",WALLS],["Ceiling",CEIL],["Distribution board","OK"],["Storage rack (if installed)","fixed · complete · undamaged"]]},
 {k:"bath",name:"Bathroom",items:[["Floor tiles","OK"],["Wall tiles","W1 · W1-W2 · W2 · W2-W3 · W3 · W3-W4 · W4 · W4-W1"],["Ceiling & LK box","OK"],["Sink","fixing OK"],["Tap","installed · moving / tightened"],["Mirror","OK"],["Shower","head support · head installed · tap fixing · tap dirty"],["Shower glass","OK"],["Radiator","fixed · level · clean"],["Toilet","seat & basin OK"],["Bathroom door","closing · leaf · frame · outside frame · outside frame 45° joint"],["Threshold","side gaps · silicone · crack"],["Ventilation unit","connection · connection box"],["Cabinet","OK"]]},
 {k:"kitchen",name:"Kitchen",items:[["Skirting",SKIRT],["Floor",FLOOR],["Control panel in the cabinet","OK"],["Kitchen top","scratches · cracks · silicone"],["Backsplash","connection · scratches · cracks · silicone · silicone wall to furniture (L/R)"],["Furniture","OK"],["Tap & sink","tap installed · tap moving / tightened · sink fixing"],["Dishwasher hole","OK"],["Walls",WALLS],["Ceiling",CEIL]]},
 {k:"living",name:"Living room",items:[["Window",WIN],["Balcony door",BAL],["Skirting",SKIRT],["Floor",FLOOR],["Walls",WALLS],["Ceiling",CEIL],["Radiators",RAD]]},
 {k:"bed1",name:"Bedroom 1",items:[["Bedroom 1 door",DOOR],["Window",WIN],["Skirting",SKIRT],["Floor",FLOOR],["Walls",WALLS],["Ceiling",CEIL],["Radiators",RAD],["Furniture","OK"]]},
 {k:"bed2",name:"Bedroom 2",items:[["Bedroom 2 door",DOOR],["Window",WIN],["Skirting",SKIRT],["Floor",FLOOR],["Walls",WALLS],["Ceiling",CEIL],["Radiators",RAD],["Furniture","OK"]]},
 {k:"shaft",name:"Pipe shaft",items:[["Pipe shaft","closed"],["Fire seal around conduits","OK"]]}];
const TAGS=["Scratch","Crack","Gap","Paint","Silicone","Damaged","Missing","Loose","Water","Dirty"];
const STL={ok:"OK",nok:"NOT OK",na:"N/A"};
const POLY={living:"330,300 685,300 685,724 330,724",kitchen:"330,724 685,724 685,850 925,850 925,1065 330,1065",bed2:"685,300 925,300 925,705 685,705",
 bed1:"930,300 1272,300 1272,775 1075,775 1075,705 930,705",frd:"685,740 920,740 920,850 685,850",hall:"925,705 1075,705 1075,790 1068,790 1068,1065 925,1065",bath:"1068,790 1272,790 1272,1065 1068,1065"};
const LAB={living:[505,520,"Living room"],kitchen:[520,960,"Kitchen"],bed2:[805,470,"Bedroom 2"],bed1:[1100,470,"Bedroom 1"],frd:[800,808,"FRD"],hall:[996,880,"Hall"],bath:[1170,940,"Bath"]};
const WB={living:[[450,1035],[360,700],[505,338],[650,600]],kitchen:[[450,1035],[360,700],[505,338],[650,600]],bed2:[[805,338],[895,560],[805,672],[715,400]],
 bed1:[[960,420],[1100,338],[1242,500],[1170,680]],frd:[[712,800],[752,765],[893,795],[820,828]],hall:[[950,905],[1045,730],[1045,1000],[970,1035]],bath:[[1170,822],[1242,930],[1170,1035],[1098,930]]};
const COMPANIES=["TLC","NT"];

/* ===== storage on the phone (IndexedDB, memory fallback) ===== */
const mem={insp:{},photos:{},kv:{}};let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("herakles-inspection",1);r.onupgradeneeded=()=>{const d=r.result;["insp","photos","kv"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};
 r.onsuccess=()=>{idb=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})}
function put(store,key,val){mem[store][key]=val;if(!idb)return Promise.resolve();return new Promise(res=>{try{const t=idb.transaction(store,"readwrite");t.objectStore(store).put(val,key);t.oncomplete=()=>res();t.onerror=()=>{toast("Could not save on this phone – storage full?");res()}}catch(e){res()}})}
function del(store,key){delete mem[store][key];if(!idb)return Promise.resolve();return new Promise(res=>{try{const t=idb.transaction(store,"readwrite");t.objectStore(store).delete(key);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function loadAll(store){if(!idb)return Promise.resolve();return new Promise(res=>{try{const t=idb.transaction(store,"readonly");const s=t.objectStore(store);const rq=s.openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem[store][c.key]=c.value;c.continue()}else res()};rq.onerror=()=>res()}catch(e){res()}})}

/* ===== helpers ===== */
const $app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const aptById=id=>APTS.find(a=>a.id===id);const roomByK=k=>ROOMS.find(r=>r.k===k);
const me=()=>mem.kv.me||null;
function insp(a){if(!mem.insp[a])mem.insp[a]={apt:a,lines:{},signs:{},startedAt:null,signedAt:null,sharedAt:null};return mem.insp[a]}
const save=a=>put("insp",a,insp(a));
const L=(a,r,i)=>insp(a).lines[r+":"+i]||null;
function roomStat(a,r){const R=roomByK(r);let done=0,nok=0,flag=0;R.items.forEach((_,ix)=>{const l=L(a,r,ix+1);if(l&&l.s)done++;if(l&&l.s==="nok")nok++;if(l&&l.flag)flag++});
 return {n:R.items.length,done,nok,flag,complete:done===R.items.length,cls:done===R.items.length?(nok?"s-nok":"s-done"):done?"s-prog":""}}
function aptStat(a){let rooms=ROOMS.length,complete=0,nok=0,flag=0,lines=0,done=0;ROOMS.forEach(R=>{const s=roomStat(a,R.k);if(s.complete)complete++;nok+=s.nok;flag+=s.flag;lines+=s.n;done+=s.done});
 const I=mem.insp[a];return {rooms,complete,nok,flag,lines,done,signed:!!(I&&I.signedAt),shared:!!(I&&I.sharedAt),started:!!(I&&done)}}
const locked=a=>!!insp(a).signedAt;

/* ===== header / dock ===== */
function header(title,back){document.getElementById("hTitle").textContent=title;const b=document.getElementById("backBtn");b.hidden=!back;b.onclick=()=>{location.hash=back==="home"?"":back}}
function dock(html){const d=document.getElementById("dock");if(!html){d.hidden=true;return}d.hidden=false;document.getElementById("dockIn").innerHTML=html}

/* ===== plan drawing ===== */
function planSVG(a,sel){let s=`<svg viewBox="300 250 1010 880" role="img" aria-label="Floor plan; tap a room">`;
 s+=`<text x="801" y="282" text-anchor="middle" class="l2">FAÇADE (windows)</text><text x="801" y="1112" text-anchor="middle" class="l2">CORRIDOR · ENTRANCE ↑</text>`;
 for(const k in POLY){const c=sel?((k===sel||(sel==="living"&&k==="kitchen")||(sel==="kitchen"&&k==="living"))?(k===sel?"sel":""):"dim"):roomStat(a,k).cls;
  s+=`<polygon class="rm ${c}" points="${POLY[k]}" data-room="${k}" tabindex="0" role="button" aria-label="${esc(LAB[k][2])}"></polygon>`}
 [[390,510],[515,620],[740,865],[985,1215]].forEach(([x1,x2])=>{s+=`<rect class="win" x="${x1}" y="292" width="${x2-x1}" height="16"></rect>`});
 for(const k in LAB){if(sel&&k!==sel&&!((sel==="kitchen"&&k==="living")||(sel==="living"&&k==="kitchen")))continue;s+=`<text x="${LAB[k][0]}" y="${LAB[k][1]}" text-anchor="middle">${LAB[k][2]}</text>`}
 if(sel&&WB[sel])WB[sel].forEach(([x,y],i)=>{s+=`<g class="wb"><circle cx="${x}" cy="${y}" r="25"></circle><text x="${x}" y="${y+7}" text-anchor="middle">W${i+1}</text></g>`});
 return s+"</svg>"}

/* ===== views ===== */
function viewSetup(){header("Who is recording?",me()?"home":null);dock(null);const m=me()||{name:"",company:""};
 $app.innerHTML=`<h1>Your name</h1><p class="sub">Saved on this phone and printed on every report you make.</p>
 <div class="field"><label for="nm">Name</label><input type="text" id="nm" autocomplete="name" value="${esc(m.name)}" placeholder="e.g. Dan Ardeleanu"></div>

   if(x===M)x=M+cw+6;else{x=M;py+=rowH;rowH=0}}}
 doc.addPage();doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text("Signatures",M,18);doc.setFont("helvetica","normal");doc.setFontSize(9.5);
 doc.text(doc.splitTextToSize(pdfTxt(`The undersigned confirm that the visual inspection of LGH ${A.lgh} (modules ${A.bq}+${A.bp}) was carried out jointly and that the results in this report are complete. Points marked NOT AGREED are recorded as disputed by the other company.`),W-2*M),M,26);
 [["Recorder",I.signs.rec],["Countersigned",I.signs.other]].forEach(([t,sg],k)=>{const x=M+k*92,yy=42;doc.setFont("helvetica","bold");doc.text(t,x,yy);doc.setFont("helvetica","normal");
  doc.text(pdfTxt(`${sg.name} (${sg.company})`),x,yy+6);doc.text(pdfTxt(dt(sg.at)),x,yy+11);doc.setDrawColor(212,219,226);doc.rect(x,yy+14,84,30);try{doc.addImage(sg.sig,"PNG",x+1,yy+15,82,28)}catch(e){}});
 const n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);doc.setFontSize(7.5);doc.setTextColor(91,105,119);doc.text(pdfTxt(`LGH ${A.lgh} · ${A.bq}+${A.bp} · page ${p} of ${n}`),M,292);doc.text("HERAKLES JOINT INSPECTION APP",W-M,292,{align:"right"})}
 return doc.output("blob")}
async function shareReport(a){if(!window.jspdf){toast("The report tool did not load – connect to the internet once and try again.");return}
 const A=aptById(a);toast("Preparing the report…");let blob;try{blob=await buildPDF(a)}catch(e){toast("The report could not be made.");return}
 const name=`Herakles inspection LGH ${A.lgh} (${A.bq}+${A.bp}) ${new Date(insp(a).signedAt).toISOString().slice(0,10)}.pdf`;const file=new File([blob],name,{type:"application/pdf"});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name,text:`Joint inspection report LGH ${A.lgh}, HUS B Herakles`});insp(a).sharedAt=Date.now();save(a);route();return}}catch(e){if(e&&e.name==="AbortError")return}
 const url=URL.createObjectURL(blob);const lk=document.createElement("a");lk.href=url;lk.download=name;document.body.appendChild(lk);lk.click();lk.remove();
 insp(a).sharedAt=Date.now();save(a);toast("Report saved to Downloads – send it from there");route()}

/* ===== routing ===== */
function route(){const h=location.hash.slice(1);let m;
 if(!me()||h==="me"){viewSetup();return}
 if((m=h.match(/^r-(\d{4}-\d{4})-([a-z0-9]+)$/))&&aptById(m[1])&&roomByK(m[2]))viewRoom(m[1],m[2]);
 else if((m=h.match(/^a-(\d{4}-\d{4})$/))&&aptById(m[1]))viewApt(m[1]);
 else if((m=h.match(/^sign-(\d{4}-\d{4})$/))&&aptById(m[1]))viewSign(m[1]);
 else viewHome()}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});

 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 route()})();
})();
