<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Herakles Joint Inspection</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f5fa8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: plan-first site tool. The apartment plan is the main screen; you only touch the phone when you see a defect. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#17202a; --muted:#5b6977; --line:#d4dbe2;
  --accent:#1f5fa8; --accent-ink:#ffffff; --accent-soft:#e2ecf8;
  --ok:#1b7743; --ok-soft:#dff1e6; --nok:#b42318; --nok-soft:#fbe4e1; --warn:#a86200; --warn-soft:#fcefd6; --na-soft:#eaedf1;
  --wall:#17202a; --room:#ffffff; --preview:#5b3fa0; --preview-soft:#ece6f8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#19212a; --ink:#e6ecf2; --muted:#98a6b4; --line:#2d3945;
  --accent:#6aa6ec; --accent-ink:#0c1520; --accent-soft:#1c2e44;
  --ok:#5bc489; --ok-soft:#163225; --nok:#ff8a7d; --nok-soft:#3a1c1a; --warn:#efb448; --warn-soft:#382a11; --na-soft:#242d37;
  --wall:#e6ecf2; --room:#19212a; --preview:#b9a2f0; --preview-soft:#2a2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --ink:#e6ecf2; --muted:#98a6b4; --line:#2d3945;
  --accent:#6aa6ec; --accent-ink:#0c1520; --accent-soft:#1c2e44;
  --ok:#5bc489; --ok-soft:#163225; --nok:#ff8a7d; --nok-soft:#3a1c1a; --warn:#efb448; --warn-soft:#382a11; --na-soft:#242d37;
  --wall:#e6ecf2; --room:#19212a; --preview:#b9a2f0; --preview-soft:#2a2340; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
header.top .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.back{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:9px;min-width:42px;height:42px;font-size:22px;cursor:pointer}
.ttl{flex:1;min-width:0}
.ttl .app{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;opacity:.85;display:block}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:9px;height:42px;padding:0 12px;font:inherit;font-weight:600;cursor:pointer}
.timer{font-family:var(--mono);font-size:15px;font-weight:600;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.18);font-variant-numeric:tabular-nums}
.timer.late{background:#f7d27a;color:#3b2a00}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
h1{font-size:22px;margin:4px 0 6px;text-wrap:balance} h2{font-size:17px;margin:22px 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.banner{background:var(--preview-soft);color:var(--preview);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}
.banner b{color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:inherit;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.k{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.big{font-size:19px;font-weight:700}
.bar{height:7px;border-radius:4px;background:var(--na-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--na-soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.nok{background:var(--nok-soft);color:var(--nok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.ex{background:var(--preview-soft);color:var(--preview)}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{color:var(--nok);border-color:var(--nok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
button:focus-visible,.card:focus-visible,input:focus-visible,polygon:focus-visible,g:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--surface);color:var(--ink)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{min-height:52px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.choice button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.plan svg{display:block;width:100%;height:auto;touch-action:manipulation}
.rm{fill:var(--room);stroke:var(--wall);stroke-width:5;cursor:pointer}
.rm.done{fill:var(--ok-soft)} .rm.sel{fill:var(--accent-soft);stroke:var(--accent);stroke-width:8} .rm.dim{opacity:.4}
.plan text{fill:var(--ink);font-family:var(--sans);font-size:32px;font-weight:600;pointer-events:none}
.plan .l2{font-size:24px;font-weight:500;fill:var(--muted)}
.plan .cnt circle{fill:var(--nok)} .plan .cnt text{fill:var(--surface);font-family:var(--mono);font-size:26px;font-weight:600}
.plan .wb{cursor:pointer}
.plan .wb circle{fill:var(--surface);stroke:var(--accent);stroke-width:4}
.plan .wb text{fill:var(--accent);font-family:var(--mono);font-size:24px;font-weight:600}
.plan .wb.hit circle{fill:var(--nok);stroke:var(--nok)} .plan .wb.hit text{fill:var(--surface)}
.plan .win{fill:var(--surface);stroke:var(--wall);stroke-width:2}
.plan .heat{fill:var(--nok);pointer-events:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ph-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ph-row b{font-size:18px}
.surfs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.surf{position:relative;min-height:64px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:700;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.surf small{font-weight:500;font-size:12px;opacity:.85}
.surf .n{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--nok);color:var(--surface);font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-family:var(--mono)}
.hint{font-size:13px;color:var(--muted);margin:0}
.dlist{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.drow img,.drow .noimg{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:var(--na-soft)}
.drow .noimg{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.drow .t{flex:1;min-width:0}
.drow .t b{display:block;font-size:14.5px}
.drow .t span{font-size:12.5px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;flex:none}
.look{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.look b{color:var(--ink);font-weight:600}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.rbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:12px;font:inherit;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:50px;text-align:left}
.rbtn.done{background:var(--ok-soft);border-color:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center}
.dock .info{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
.dock .info b{color:var(--ink);display:block;font-size:15px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box.good{border-color:var(--ok);background:var(--ok-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;z-index:40;font-size:14px;max-width:90vw}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* capture sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet .sh-head{background:var(--accent);color:var(--accent-ink)}
.sheet .sh-head .in,.sheet .sh-body,.sheet .sh-foot .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .sh-head .in{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheet .sh-scroll{flex:1;overflow-y:auto}
.sheet .sh-body{padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
.sheet .sh-foot{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh-foot .in{display:flex;gap:10px;padding-block:10px}
.sheet .sh-foot .btn.primary{flex:1}
.phbox{display:flex;gap:12px;align-items:center}
.phbox .th{width:92px;height:92px;border-radius:10px;object-fit:cover;background:var(--na-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;border:1px solid var(--line)}
.phbox .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.st-ok{color:var(--ok);font-weight:600} .st-wait{color:var(--warn);font-weight:600} .st-err{color:var(--nok);font-weight:600}
.same{border:1.5px dashed var(--accent);background:var(--surface);color:var(--accent);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;text-align:left;cursor:pointer;min-height:56px}
.same span{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--nok-soft);border-color:var(--nok);color:var(--nok);font-weight:600}
.chip.el[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.more{color:var(--muted);border-style:dashed}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.seg3 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.flag{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;align-items:center;font-size:14px}
.hb .lbl{min-width:0}
.hb .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hb .trk{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--na-soft);overflow:hidden}
.hb .trk i{display:block;height:100%;background:var(--nok)}
.hb .trk i.tr{background:var(--accent)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.z{color:var(--line)}
td.h1{background:var(--nok-soft);color:var(--nok);font-weight:600}
td.h2{background:var(--nok);color:var(--surface);font-weight:700}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fchips .chip{flex:none;min-height:38px;padding:6px 12px;font-size:14px}
.fchips .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.sys{display:flex;flex-direction:column;gap:6px}
.sys div{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.sys div b{font-family:var(--mono);color:var(--nok);flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* checklist items */
.mini{max-height:210px;display:flex;justify-content:center}
.mini svg{width:auto;max-width:100%;height:200px}
.items{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item.s-ok{border-color:var(--ok)}
.item.s-nok{border-color:var(--nok)}
.ihead{display:flex;align-items:stretch;min-height:58px}
.iname{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.iname b{font-size:16px}
.iname small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.s-nok .iname small{color:var(--nok)}
.okb{flex:none;width:84px;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--ok);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.okb[aria-pressed="true"]{background:var(--ok);color:var(--surface)}
.nokb{flex:none;width:84px;border-left:1px solid var(--line);background:var(--nok-soft);color:var(--nok);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;text-align:center;padding:0 6px}
.pts{border-top:1px dashed var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.pts .hint{margin-bottom:2px}
.pt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:10px 12px;min-height:48px;cursor:pointer;text-align:left}
.pt .stt{font-size:13px;font-weight:600;color:var(--ok);flex:none}
.pt.bad{border-color:var(--nok);background:var(--nok-soft)}
.pt.bad .stt{color:var(--nok)}
.ddl{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.pts .ddl{padding:0}
.nab{flex:none;width:58px;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.nab[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.item.s-na{border-color:var(--warn)}
.naw{border-top:1px dashed var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.chip.nac[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pt.add{border-style:dashed;color:var(--accent);font-weight:600}
.floorh{display:flex;gap:6px;align-items:baseline;margin-top:18px}
.floorh .muted{font-size:13px;font-weight:500}
.phstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.phw{position:relative;flex:none}
.phw .th{width:84px;height:84px}
.phx{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:15px;cursor:pointer}
.addph2{flex:none;width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font:inherit;font-size:26px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.addph2 small{font-size:11.5px;font-weight:600}
.phbox{flex-direction:column;align-items:stretch;gap:6px}
.wrule{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wsvg{width:120px;flex:none}
.wsvg .wr{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2}
.wsvg .wd{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.wsvg text{fill:var(--accent);font-family:var(--mono);font-size:10px;font-weight:600;text-anchor:middle}
.floorh{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.plan .blk{fill:var(--na-soft);stroke:var(--line);stroke-width:2}
.plan rect.rm{stroke-width:4}
.plan .sk{font-size:30px}
.plan .skn{fill:var(--surface);font-family:var(--mono);font-size:20px;font-weight:600}
.plan .skw{font-size:20px}
.plan .cnt circle{fill:var(--nok)}
.plan svg{max-height:300px;width:auto;max-width:100%;margin:0 auto}
.plan.mini svg{max-height:190px}
.plan .dgap{stroke:var(--room);stroke-width:9;stroke-linecap:butt}
.plan .dent{stroke:var(--accent);stroke-width:9}
.plan .dent-a{fill:var(--accent)}

.plan .dopen{stroke:var(--wall);stroke-width:2;stroke-dasharray:6 7;opacity:.6}

function sketchSVG(a,typ,sel){const T=SK[typ];if(!T)return "";const M=Math.max(T.W,T.H),sc=820/M,pad=sel?48:14,lf=26,VW=T.W*sc+2*pad,VH=T.H*sc+2*pad+2*(lf+14)+20;
 const X=x=>pad+x*sc,Y=y=>pad+lf+34+y*sc;
 let s=`<svg viewBox="0 0 ${VW.toFixed(0)} ${VH.toFixed(0)}" role="img" aria-label="${sel?"Wall numbers for this room":"Apartment sketch. Tap a room."}">`;
 s+=`<text x="${VW/2}" y="${pad+lf}" text-anchor="middle" class="l2" style="font-size:${lf}px">${T.top}</text><text x="${VW/2}" y="${VH-pad}" text-anchor="middle" class="l2" style="font-size:${lf}px">${T.bot}</text>`;
 (T.block||[]).forEach(([x,y,w,h,t])=>{s+=`<rect class="blk" x="${X(x)}" y="${Y(y)}" width="${w*sc}" height="${h*sc}"></rect>`;if(t)s+=`<text x="${X(x+w/2)}" y="${Y(y+h/2)+8}" text-anchor="middle" class="l2" style="font-size:${Math.min(lf,w*sc/(t.length*0.6))}px">${t}</text>`});
 const rs=useApt(a.__id||curApt);const has=k=>rs.find(r=>r.k===k);
 for(const k in T.rooms){if(!has(k))continue;const st=roomStat(a,k);const c=sel?(k===sel?"sel":"dim"):(st.complete?"done":"");
  T.rooms[k].r.forEach(([x,y,w,h])=>{s+=sel?`<rect class="rm ${c}" x="${X(x)}" y="${Y(y)}" width="${w*sc}" height="${h*sc}"></rect>`:`<rect class="rm ${c}" x="${X(x)}" y="${Y(y)}" width="${w*sc}" height="${h*sc}" data-room="${k}" tabindex="0" role="button" aria-label="${esc(roomByK(k).name)}"></rect>`})}
 /* door openings: gap in the wall + short leaf mark */
 for(const k in T.rooms){if(!has(k))continue;const R=T.rooms[k],[x1,y1,x2,y2]=R.dr;s+=`<line class="dgap" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"></line>`;if(R.open)s+=`<line class="dopen" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"></line>`}
 (T.opn||[]).forEach(([x1,y1,x2,y2])=>{s+=`<line class="dgap" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"></line><line class="dopen" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"></line>`});
 if(T.ent){const [x1,y1,x2,y2]=T.ent;const mx=(X(x1)+X(x2))/2;s+=`<line class="dent" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"></line><path class="dent-a" d="M${mx-13} ${Y(y1)-26} L${mx+13} ${Y(y1)-26} L${mx} ${Y(y1)-8} Z"></path>`}
 for(const k in T.rooms){if(!has(k))continue;const [x,y,w,h]=T.rooms[k].r[0];const st=roomStat(a,k);
  if(!sel){const nm=(k==="bed1"&&!has("bed2"))?"Bed":({hall:"Hall",frd:"FRD",bath:"Bath",kitchen:"Kit.",living:"Living",bed1:"Bed 1",bed2:"Bed 2"})[k];const txt=nm+(st.complete?" ✓":"");
   const fs=Math.max(15,Math.min(M*sc*0.045,w*sc/(txt.length*0.62),h*sc*0.55));s+=`<text x="${X(x+w/2)}" y="${Y(y+h/2)+fs*0.35}" text-anchor="middle" class="sk" style="font-size:${fs.toFixed(0)}px">${txt}</text>`;
   if(st.defs){const cr=Math.min(16,h*sc*0.22);s+=`<g class="cnt"><circle cx="${X(x+w/2)}" cy="${Y(y+h/2)+fs*0.35+cr+4}" r="${cr}"></circle><text x="${X(x+w/2)}" y="${Y(y+h/2)+fs*0.35+cr*1.45+4}" text-anchor="middle" class="skn" style="font-size:${cr*1.25}px">${st.defs}</text></g>`}}
  else if(k===sel){const bR=Math.max(30,Math.min(46,Math.min(w,h)*sc*0.2));const ws=wallSides(T.rooms[k].d);const mid={N:[x+w/2,y],S:[x+w/2,y+h],W:[x,y+h/2],E:[x+w,y+h/2]};
   ws.forEach((sd,i)=>{const w0="W"+(i+1);const n=a.defects.filter(d=>d.room===k&&d.wall===w0).length;const [cx,cy]=mid[sd];
    s+=`<g class="wb${n?" hit":""}"><circle cx="${X(cx)}" cy="${Y(cy)}" r="${bR}"></circle><text x="${X(cx)}" y="${Y(cy)+bR*0.32}" text-anchor="middle" class="skw" style="font-size:${bR*0.95}px">${w0}</text></g>`})}}
 return s+"</svg>"}

function viewSetup(){header("Who is recording?",S().me?"home":null);dock(null);curApt=null;const m=S().me||{name:"",company:""};

  $app.innerHTML=`<h1>Who is recording?</h1><p class="sub">Printed on every report you make.</p>
  <div class="field"><label>Company</label><div class="choice">${["TLC","NT"].map(c=>`<button data-co="${c}" aria-pressed="${co===c}">${c}</button>`).join("")}</div></div>
  ${co?`<div class="field"><label>Name</label><div class="chips">${list.map(n=>`<button class="chip el" data-nm="${esc(n)}" aria-pressed="${nm===n}">${esc(n)}</button>`).join("")}<button class="chip more" data-nm="__other" aria-pressed="${other}">Other name</button></div></div>

async function shrink(file){const MAX=1600;
 try{if("createImageBitmap" in window){const bmp=await createImageBitmap(file);const k=Math.min(1,MAX/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close&&bmp.close();
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.78));if(b)return b}}catch(e){}
 const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
  const k=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.78))}catch(e){return file}finally{URL.revokeObjectURL(url)}}

function aptStat(a){let n=0,ok=0,nok=0,na=0,r2=0;ROOMS.forEach(R=>R.items.forEach((_,i)=>{n++;const s=itemState(a,R.k,i);if(s==="ok"){ok++;if((R.k+":"+i) in a.na)r2++}else if(s==="nok")nok++;else if(s==="na")na++}));
 return {n,ok,nok,na,r2,defs:a.defects.length,flag:a.defects.filter(d=>d.flag).length}}
function orderedDefs(a){const ord=ROOMS.map(R=>R.k);return a.defects.slice().sort((x,y)=>(ord.indexOf(x.room)-ord.indexOf(y.room))||((x.i<0?999:x.i)-(y.i<0?999:y.i))||((x.j<0?999:x.j)-(y.j<0?999:y.j))||(x.at-y.at))}
const resultTxt=(a,k,i)=>{const s=itemState(a,k,i);const na=(k+":"+i) in a.na;const r2=itemDefs(a,k,i).some(d=>d.rnd===2);
 return s==="ok"?(na?"OK (2nd round)":"OK"):s==="nok"?(r2?"NOT OK (2nd round)":"NOT OK"):s==="na"?"N/A":"not checked"};

function makePad(c,onInk){const dpr=window.devicePixelRatio||1;const rc=c.getBoundingClientRect();c.width=rc.width*dpr;c.height=rc.height*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
 g.lineWidth=2.6;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#111";let dn=false,last=null,ink=false;const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
 c.addEventListener("pointerdown",e=>{dn=true;last=pt(e);try{c.setPointerCapture(e.pointerId)}catch(x){}});
 c.addEventListener("pointermove",e=>{if(!dn)return;const p=pt(e);g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p;if(!ink){ink=true;onInk()}});
 c.addEventListener("pointerup",()=>{dn=false});c.addEventListener("pointercancel",()=>{dn=false});
 return {clear(){g.clearRect(0,0,c.width,c.height);ink=false},png(){const o=document.createElement("canvas");o.width=480;o.height=Math.round(480*rc.height/rc.width);const og=o.getContext("2d");og.fillStyle="#fff";og.fillRect(0,0,o.width,o.height);og.drawImage(c,0,0,o.width,o.height);return o.toDataURL("image/png")}}}

 for(const k in T.rooms){if(!has(k))continue;const R=T.rooms[k];s+=ln("#ffffff",10)(R.dr);if(R.open)s+=ln("#17202a",2,"7 7")(R.dr)}
 (T.opn||[]).forEach(o=>{s+=ln("#ffffff",10)(o)+ln("#17202a",2,"7 7")(o)});
 if(T.ent){const [x1,y1,x2]=T.ent;const mx=(X(x1)+X(x2))/2;s+=ln("#1f5fa8",10)(T.ent)+`<path d="M${mx-14} ${Y(y1)-28} L${mx+14} ${Y(y1)-28} L${mx} ${Y(y1)-9} Z" fill="#1f5fa8"/>`}
 for(const k in T.rooms){if(!has(k))continue;const [x,y,w,h]=T.rooms[k].r[0];const st=roomStat(a,k);

  y=doc.lastAutoTable.finalY+5});

 if(defs.length){doc.addPage();head(`LGH ${Pp.lgh} - defect list`);

/* one flat table per apartment – every checklist point and every defect (for collecting all reports) */
function aptRows(Pp){useApt(Pp.id);const a=S().apts[Pp.id];if(!a)return [];const defs=orderedDefs(a);const no={};defs.forEach((d,k)=>no[d.id]="D"+(k+1));const out=[];
 const base={"LGH":Pp.lgh,"Modules":Pp.mods,"Plan":Pp.plan,"Type":Pp.typ,"Started":dtF(a.startedAt),"Signed":dtF(a.signedAt),"Revision":a.signedAt?(a.rev||0):""};
 const drow=(R,d,res)=>Object.assign({},base,{"Room":R.name,"Item":d.item,"Point":d.point,"Wall":d.wall||"","Result":res,"Defect no.":no[d.id],"Defect":issueTxt(d),"Category":d.cat,"Severity":d.sev,"Trade":d.trade,"Not agreed":d.flag?"YES":"","Note":d.issue==="Other"?"":(d.note||""),"Photos":(d.photos||[]).length||"","Round":d.rnd===2?"2nd":"1st","N/A reason":"","Recorded by":d.by||"","Time":dtF(d.at)});
 ROOMS.forEach(R=>{R.items.forEach(([name,pts],i)=>{const res=resultTxt(a,R.k,i);const key=R.k+":"+i;
  pts.forEach((p,j)=>{const ds=a.defects.filter(d=>d.room===R.k&&d.i===i&&d.j===j);
   if(ds.length)ds.forEach(d=>out.push(drow(R,d,res)));
   else out.push(Object.assign({},base,{"Room":R.name,"Item":name,"Point":p,"Wall":wallOf(p)||"","Result":res.startsWith("NOT OK")?"OK":res,"Defect no.":"","Defect":"","Category":"","Severity":"","Trade":"","Not agreed":"","Note":"","Photos":"","Round":"","N/A reason":key in a.na?(a.na[key]||"not able to inspect"):"","Recorded by":"","Time":""}))});
  a.defects.filter(d=>d.room===R.k&&d.i===i&&d.j===-1).forEach(d=>out.push(drow(R,d,res)))});
  a.defects.filter(d=>d.room===R.k&&d.i===-1).forEach(d=>out.push(drow(R,d,"NOT OK (other item)")))});
 return out}
function toCSV(rows){if(!rows.length)return "";const cols=Object.keys(rows[0]);const q=v=>{const s=String(v==null?"":v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};

const fileBase=(Pp,a)=>`Herakles HUS B LGH ${Pp.lgh} mod ${Pp.mods.replace(/ \((west|east) half\)/,(m0,x)=>x[0].toUpperCase())} ${new Date(a.signedAt||Date.now()).toISOString().slice(0,10)}${a.rev?" rev"+a.rev:""}`;
function saveBlob(b,name){const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
let sharing=false;
async function shareReport(id){if(sharing)return;const Pp=aptById(id);const a=A(id);if(!window.jspdf){toast("The report tool did not load – open the app once with internet");return}
 sharing=true;toast("Preparing the report…");let pdf,csv;
 try{pdf=await buildPDF(id);csv=new Blob([toCSV(aptRows(Pp))],{type:"text/csv"})}catch(e){console.error(e);toast("The report could not be made");sharing=false;return}
 const base=fileBase(Pp,a);const f1=new File([pdf],base+".pdf",{type:"application/pdf"}),f2=new File([csv],base+".csv",{type:"text/csv"});
 const done=()=>{a.sentAt=Date.now();saveState();sharing=false;render()};
 try{if(navigator.canShare&&navigator.canShare({files:[f1,f2]})){await navigator.share({files:[f1,f2],title:base,text:`Joint inspection report LGH ${Pp.lgh} (modules ${Pp.mods}), HUS B Herakles${a.rev?" – revision "+a.rev:""}.\nPDF = signed report, CSV = all points and defects (opens in Excel).`});done();return}
  if(navigator.canShare&&navigator.canShare({files:[f1]})){await navigator.share({files:[f1],title:base,text:`Joint inspection report LGH ${Pp.lgh}, HUS B Herakles`});saveBlob(csv,f2.name);done();return}}
 catch(e){if(e&&e.name==="AbortError"){sharing=false;return}}
 saveBlob(pdf,f1.name);setTimeout(()=>saveBlob(csv,f2.name),700);toast("Report saved to Downloads – send it from there");done()}
